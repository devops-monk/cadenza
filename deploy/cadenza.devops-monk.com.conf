# Cadenza website: a static site, nothing else. Lives in its own file in
# sites-available so the other apps' server blocks on this VPS are untouched.
# certbot --nginx adds the 443 block and the redirect to this file only.
server {
    listen 80;
    listen [::]:80;
    server_name cadenza.devops-monk.com;

    root /var/www/cadenza;
    index index.html;

    access_log /var/log/nginx/cadenza.access.log;
    error_log  /var/log/nginx/cadenza.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Screenshots and icons never change under the same name between deploys
    # long enough to matter; HTML is always revalidated.
    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The tools that render the screenshots are not part of the site.
    location ^~ /tools/ { return 404; }
}
